<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24442A" />
      <stop offset="100%" stop-color="#142617" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B3320" />
    </linearGradient>

    <!-- Circular Text Paths -->
    <!-- Top Arc (Clockwise for SECRET GARDEN) -->
    <path id="topTextArc" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" />
    <!-- Bottom Arc (Counter-Clockwise or inverted for HOSTEL • CAT BA ISLAND) -->
    <path id="bottomTextArc" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" />
  </defs>

  <!-- Outer Forest Green Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGlow)" stroke="#D4AF37" stroke-width="4" />
  
  <!-- Subtle Ornamental Inner Rings -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6" />
  <circle cx="250" cy="250" r="130" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7" />
  <circle cx="250" cy="250" r="122" fill="#142617" stroke="#D4AF37" stroke-width="1" opacity="0.9" />

  <!-- Botanical Wreath & Tropical Foliage in Center -->
  <g transform="translate(250, 250)">
    <!-- Central Monogram / Icon -->
    <!-- Stylized Monstera / Fern Leaf Motif -->
    <path d="M0,-65 C25,-40 35,-10 0,55 C-35,-10 -25,-40 0,-65 Z" fill="url(#leafGrad)" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M0,-65 L0,55" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Leaf ribs & cutouts -->
    <path d="M0,-35 C15,-30 22,-20 25,-12" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    <path d="M0,-15 C18,-10 26,0 28,10" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    <path d="M0,5 C14,10 20,20 22,30" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    
    <path d="M0,-35 C-15,-30 -22,-20 -25,-12" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    <path d="M0,-15 C-18,-10 -26,0 -28,10" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    <path d="M0,5 C-14,10 -20,20 -22,30" stroke="#D4AF37" stroke-width="1.2" fill="none" />

    <!-- Left & Right Laurel Sprigs -->
    <!-- Left Laurel -->
    <g transform="scale(-1,1)">
      <path d="M-45,35 C-70,10 -70,-35 -45,-60" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="-48" cy="-55" rx="5" ry="9" transform="rotate(-30 -48 -55)" fill="url(#goldGrad)" />
      <ellipse cx="-62" cy="-35" rx="5" ry="9" transform="rotate(-15 -62 -35)" fill="url(#goldGrad)" />
      <ellipse cx="-67" cy="-12" rx="5" ry="9" transform="rotate(5 -67 -12)" fill="url(#goldGrad)" />
      <ellipse cx="-62" cy="12" rx="5" ry="9" transform="rotate(25 -62 12)" fill="url(#goldGrad)" />
      <ellipse cx="-48" cy="32" rx="5" ry="9" transform="rotate(45 -48 32)" fill="url(#goldGrad)" />
    </g>

    <!-- Right Laurel -->
    <g>
      <path d="M45,35 C70,10 70,-35 45,-60" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="48" cy="-55" rx="5" ry="9" transform="rotate(30 48 -55)" fill="url(#goldGrad)" />
      <ellipse cx="62" cy="-35" rx="5" ry="9" transform="rotate(15 62 -35)" fill="url(#goldGrad)" />
      <ellipse cx="67" cy="-12" rx="5" ry="9" transform="rotate(-5 67 -12)" fill="url(#goldGrad)" />
      <ellipse cx="62" cy="12" rx="5" ry="9" transform="rotate(-25 62 12)" fill="url(#goldGrad)" />
      <ellipse cx="48" cy="32" rx="5" ry="9" transform="rotate(-45 48 32)" fill="url(#goldGrad)" />
    </g>

    <!-- Center Monogram SG text -->
    <text y="8" font-family="'Playfair Display', 'Cinzel', serif" font-weight="900" font-size="28" fill="#F5F5F0" text-anchor="middle" letter-spacing="2" opacity="0.95" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">
      SG
    </text>

    <!-- Small Star at Bottom of Center -->
    <polygon points="0,48 3,55 10,55 5,59 7,66 0,62 -7,66 -5,59 -10,55 -3,55" fill="#D4AF37" />
  </g>

  <!-- Curving Circular Typography -->
  <!-- Top Circular Text: SECRET GARDEN -->
  <text fill="url(#goldGrad)" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="23" font-weight="700" letter-spacing="6.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SECRET GARDEN
    </textPath>
  </text>

  <!-- Bottom Circular Text: HOSTEL • CAT BA ISLAND -->
  <text fill="#A3E635" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14.5" font-weight="800" letter-spacing="4.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      HOSTEL • CAT BA ISLAND
    </textPath>
  </text>

  <!-- Side Accent Stars -->
  <polygon points="78,250 81,256 87,256 82,260 84,266 78,262 72,266 74,260 69,256 75,256" fill="#D4AF37" />
  <polygon points="422,250 425,256 431,256 426,260 428,266 422,262 416,266 418,260 413,256 419,256" fill="#D4AF37" />
</svg>
